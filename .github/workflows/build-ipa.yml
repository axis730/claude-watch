name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ClaudeWatch (iOS + embedded watchOS, unsigned)
        working-directory: ios/ClaudeWatch
        run: |
          xcodebuild \
            -project ClaudeWatch.xcodeproj \
            -scheme ClaudeWatch \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package IPA (with Watch app)
        working-directory: ios/ClaudeWatch
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app")
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ClaudeWatch.ipa Payload

      - name: Package IPA (iPhone only, Watch app stripped)
        working-directory: ios/ClaudeWatch
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app")
          mkdir -p PayloadNoWatch/Payload
          cp -r "$APP_PATH" PayloadNoWatch/Payload/
          rm -rf "PayloadNoWatch/Payload/$(basename "$APP_PATH")/Watch"
          cd PayloadNoWatch && zip -r ../ClaudeWatch-NoWatch.ipa Payload && cd ..
          ls -la ClaudeWatch-NoWatch.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeWatch-ipa
          path: ios/ClaudeWatch/ClaudeWatch.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeWatch-NoWatch-ipa
          path: ios/ClaudeWatch/ClaudeWatch-NoWatch.ipa
